<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" width="620" height="420" role="img" aria-label="Map showing 2BN Garrison Main Road, the turn onto Apremdo Road, a short walk down the road, with Apremdo Market on the left and IKE K VENTURES directly opposite on the right.">
  <title>Directions to IKE K VENTURES</title>
  <desc>Start on 2BN Garrison Main Road, branch onto Apremdo Road, walk a short distance down; Apremdo Market is on the left and IKE K VENTURES is directly opposite on the right.</desc>

  <defs>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/>
    </marker>
    <marker id="arrow-teal-rev" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#0D9488"/>
    </marker>
    <marker id="arrow-navy" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0F2C59"/>
    </marker>
  </defs>

  <!-- Soft Cool Blue-Gray Background -->
  <rect width="620" height="420" rx="8" fill="#F4F8FB"/>

  <!-- ====== 1. 2BN GARRISON (TOP LEFT) ====== -->
  <rect x="32" y="24" width="180" height="54" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="122" y="49" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F2C59" text-anchor="middle">2BN Garrison</text>
  <text x="122" y="66" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">Main Road Landmark</text>

  <!-- ====== 2. 2BN GARRISON MAIN ROAD (HORIZONTAL) ====== -->
  <rect x="0" y="96" width="620" height="52" fill="#DCE5EF"/>
  <line x1="0" y1="122" x2="265" y2="122" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="12 8"/>
  <line x1="355" y1="122" x2="620" y2="122" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="12 8"/>

  <text x="480" y="126" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0F2C59" text-anchor="middle">2BN Garrison Main Road</text>

  <!-- ====== 3. APREMDO ROAD (STRETCHED VERTICAL ROAD) ====== -->
  <rect x="270" y="148" width="80" height="272" fill="#DCE5EF"/>
  <line x1="310" y1="220" x2="310" y2="420" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="12 8"/>

  <!-- Turning curve arrow from Main Road onto Apremdo Road -->
  <path d="M 210 128 L 295 128 Q 310 128 310 145 L 310 245" fill="none" stroke="#0F2C59" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-navy)"/>

  <!-- Walking distance note along upper Apremdo Road -->
  <rect x="366" y="172" width="218" height="48" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="380" y="193" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#0D9488">Short walk down Apremdo Rd</text>
  <text x="380" y="210" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#64748B">Continue past the junction</text>

  <text x="310" y="404" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Apremdo Road ↓</text>

  <!-- ====== 4. APREMDO MARKET (LEFT SIDE) ====== -->
  <g transform="translate(32, 275)">
    <rect x="0" y="0" width="214" height="104" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="107" y="44" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F2C59" text-anchor="middle">Apremdo Market</text>
    <text x="107" y="64" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">On your left</text>
    <text x="107" y="84" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0D9488" text-anchor="middle">Market Entrance →</text>
  </g>

  <!-- ====== 5. IKE K VENTURES (RIGHT SIDE — OPPOSITE MARKET) ====== -->
  <g transform="translate(374, 275)">
    <rect x="0" y="0" width="214" height="104" rx="6" fill="#0F2C59"/>
    <rect x="52" y="14" width="110" height="20" rx="4" fill="#0D9488"/>
    <text x="107" y="28" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.04em">OUR SHOP</text>
    <text x="107" y="56" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">IKE K VENTURES</text>
    <text x="107" y="76" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#CBD5E1" text-anchor="middle">OTC Medicine Seller</text>
    <text x="107" y="92" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#5EEAD4" text-anchor="middle">← Directly opposite market</text>
  </g>

  <!-- ====== 6. OPPOSITE CONNECTOR ====== -->
  <line x1="254" y1="327" x2="366" y2="327" stroke="#0D9488" stroke-width="2" stroke-dasharray="4 3" marker-start="url(#arrow-teal-rev)" marker-end="url(#arrow-teal)"/>
</svg>
